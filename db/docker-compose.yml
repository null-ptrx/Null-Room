services:
  db: 
    image: postgres:16
    container_name: nullroom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nullroom
      POSTGRES_PASSWORD: dhami
      POSTGRES_DB: nullroom
    ports: 
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

volumes: 
   pgdata:

